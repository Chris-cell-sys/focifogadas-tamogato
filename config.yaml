# Ligák – ESPN nyilvános scoreboard (API kulcs NEM kell)
leagues:
  - key: eng.1
    name: Premier League
  - key: esp.1
    name: La Liga
  - key: ger.1
    name: Bundesliga
  - key: ita.1
    name: Serie A
  - key: fra.1
    name: Ligue 1
  - key: uefa.champions
    name: Bajnokok Ligája
  - key: uefa.europa
    name: Európa Liga
  - key: eng.2
    name: Championship

# Hány napra előre kérje a meccseket
lookahead_days: 7

# Value tipp: TippmixPro odds >= fair_odds * value_threshold és pozitív edge
value_threshold: 1.02

# Csak ebben a szorzósávban jelenjen meg tipp
odds_min: 1.8
odds_max: 2.1

# TippmixPro xG tippek
bookmaker: TippmixPro
# false = teljes lookahead (value+odds sáv); true = csak mai/legközelebbi nap
today_only: false
top_tips: 5
xg_home_advantage: 1.08
xg_min_team_games: 4
# Alsó esélyküszöb a value+sávos tippeknél (edge a döntő)
xg_min_prob_pct: 45.0
