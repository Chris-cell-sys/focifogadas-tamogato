# Ligák – ESPN nyilvános scoreboard (API kulcs NEM kell)
leagues:
  - key: eng.1
    name: Premier League
  - key: esp.1
    name: La Liga
  - key: ger.1
    name: Bundesliga
  - key: ita.1
    name: Serie A
  - key: fra.1
    name: Ligue 1
  - key: uefa.champions
    name: Bajnokok Ligája
  - key: uefa.europa
    name: Európa Liga
  - key: eng.2
    name: Championship

lookahead_days: 7

# Value: ensemble esély vs bookmaker implicit
value_threshold: 1.02
odds_min: 1.8
odds_max: 2.1

# Bankroll + profi stake (negyed-Kelly, max 3% / tipp)
bankroll: 100000
currency: HUF
kelly_fraction: 0.25
max_stake_pct: 0.03
min_stake: 500

# Ensemble súlyok: stat + xG + form
model_weights:
  stat: 0.30
  xg: 0.40
  form: 0.30

bookmaker: TippmixPro
today_only: false
top_tips: 5
xg_home_advantage: 1.08
xg_min_team_games: 4
xg_min_prob_pct: 45.0
