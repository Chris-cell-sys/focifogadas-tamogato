<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focifogadás – xG tippek</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa7b8;
      --accent: #3dd68c;
      --border: #2a3544;
      --warn: #fbbf24;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --card: #fff;
        --text: #1a2332;
        --muted: #5c6b7f;
        --accent: #0d7a4a;
        --border: #dde3ea;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.85rem;
      align-items: center;
    }
    button, .btn-link {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--accent);
      color: #052e16;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .btn-link {
      background: transparent;
      color: var(--text);
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    #status { color: var(--muted); margin-bottom: 1rem; min-height: 1.25rem; }
    #tips {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .tip-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
    }
    .tip-card strong { color: var(--accent); }
    .tip-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    #content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
    }
    #content h1 { font-size: 1.4rem; margin-top: 0; }
    #content h2 { font-size: 1.15rem; margin-top: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    #content h3 { font-size: 1rem; margin-top: 1.25rem; }
    #content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0.75rem 0 1rem;
    }
    #content th, #content td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.55rem;
      text-align: left;
    }
    #content th { background: rgba(127,127,127,0.08); }
    #content blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--accent);
      background: rgba(61, 214, 140, 0.08);
      color: var(--muted);
    }
    .err { color: #f87171; }
    .hint { color: var(--muted); font-size: 0.82rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Focifogadás – xG tippek</h1>
    <p>Meccsek + odds (ESPN) · csapat xG (Understat) · API kulcs nélkül</p>
    <div class="toolbar">
      <button type="button" id="refreshBtn" title="Legfrissebb mentett jelentés betöltése">Frissítés</button>
      <a class="btn-link" id="fetchBtn" href="https://github.com/Chris-cell-sys/focifogadas-tamogato/actions/workflows/update-odds.yml" target="_blank" rel="noopener">Új adat letöltése (GitHub Actions)</a>
    </div>
    <p class="hint">A zöld gomb azonnal újratölti az oldalt. Az „Új adat letöltése” az internetről frissít (Run workflow → ~1 perc → Frissítés).</p>
  </header>
  <main>
    <p id="status">Jelentés betöltése…</p>
    <section id="tips" aria-label="xG tippek"></section>
    <article id="content"></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const REPO = "Chris-cell-sys/focifogadas-tamogato";
    const BRANCH = "main";
    const REPORT_URL = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/reports/latest.md`;
    const JSON_URL = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/data/odds.json`;
    const cacheBust = () => `?t=${Date.now()}`;

    function renderTips(tips) {
      const box = document.getElementById("tips");
      if (!tips || !tips.length) {
        box.innerHTML = "<p class=\"hint\">Jelenleg nincs kiemelt xG tipp a küszöb felett.</p>";
        return;
      }
      box.innerHTML = tips.slice(0, 8).map((t) => `
        <div class="tip-card">
          <div><strong>${t.pick}</strong> · ${t.home_team} – ${t.away_team}</div>
          <div class="tip-meta">
            Odds: ${t.odds ? t.odds.toFixed(2) : "–"} · EV: +${t.ev_pct}% · Modell: ${t.prob_pct}% · Várható: ${t.expected_score} · O2.5: ${t.over25_prob_pct}%
          </div>
        </div>
      `).join("");
    }

    async function load({ manual = false } = {}) {
      const status = document.getElementById("status");
      const content = document.getElementById("content");
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      if (manual) status.textContent = "Frissítés…";

      try {
        const [mdRes, jsonRes] = await Promise.all([
          fetch(REPORT_URL + cacheBust(), { cache: "no-store" }),
          fetch(JSON_URL + cacheBust(), { cache: "no-store" }),
        ]);
        if (!mdRes.ok) throw new Error("Markdown HTTP " + mdRes.status);
        const md = await mdRes.text();
        content.innerHTML = marked.parse(md);

        if (jsonRes.ok) {
          const data = await jsonRes.json();
          renderTips(data.xg_tips || []);
          status.textContent =
            "Utolsó mentett adat: " +
            (data.updated_at || "?") +
            " · xG tippek: " +
            (data.xg_tips_count || 0);
        } else {
          renderTips([]);
          status.textContent = "Jelentés betöltve · JSON nem elérhető (" + jsonRes.status + ")";
        }
      } catch (e) {
        status.innerHTML = '<span class="err">Nem sikerült betölteni.</span>';
        content.innerHTML =
          "<p>Próbáld a <strong>Frissítés</strong> gombot, vagy futtasd a GitHub Actions workflow-ot.</p>";
        console.error(e);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => load({ manual: true }));
    load();
  </script>
</body>
</html>
